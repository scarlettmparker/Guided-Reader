mutation createPost($input: CreatePostInput!) {
  icarusMutations {
    createPost(input: $input) {
      message
      post {
        id
        threadId
        parentId
        body
        status
        upvotes
        downvotes
        netScore
        author {
          type
          id
        }
        authorProfile {
          id
          discordId
          discordUsername
          globalName
          avatar
          cefrLevel
        }
        myVote
        createdAt
        updatedAt
      }
    }
  }
}
