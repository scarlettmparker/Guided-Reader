mutation hadesVote($input: VoteInput!) {
  hadesMutations {
    vote(input: $input) {
      message
      annotation {
        id
        positionId
        body
        status
        upvotes
        downvotes
        netScore
        replyCount
        myVote
        updatedAt
      }
      comment {
        id
        annotationId
        body
        status
        upvotes
        downvotes
        netScore
        myVote
        updatedAt
      }
    }
  }
}
