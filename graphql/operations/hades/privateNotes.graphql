query privateNotes($textId: ID!, $pagination: PaginationInput) {
  hadesQueries {
    privateNotes(textId: $textId, pagination: $pagination) {
      items {
        id
        textId
        startOffset
        endOffset
        body
        visibility
        remoteObject
        author {
          type
          id
        }
        authorProfile {
          id
          discordId
          discordUsername
          globalName
          avatar
          cefrLevel
        }
        createdAt
        updatedAt
      }
      pageInfo {
        totalPages
        page
        size
        totalCount
      }
    }
  }
}
