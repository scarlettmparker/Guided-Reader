mutation addComment($input: CommentInput!) {
  hadesMutations {
    addComment(input: $input) {
      message
      comment {
        id
        annotationId
        parentId
        body
        status
        upvotes
        downvotes
        netScore
        author {
          type
          id
        }
        authorProfile {
          id
          discordId
          discordUsername
          globalName
          avatar
          cefrLevel
        }
        myVote
        createdAt
        updatedAt
      }
    }
  }
}
