mutation createPrivateNote($input: PrivateNoteInput!) {
  hadesMutations {
    createPrivateNote(input: $input) {
      message
      note {
        id
        textId
        startOffset
        endOffset
        body
        visibility
        remoteObject
        author {
          type
          id
        }
        authorProfile {
          id
          discordId
          discordUsername
          globalName
          avatar
          cefrLevel
        }
        createdAt
        updatedAt
      }
    }
  }
}
