mutation removeVote($targetType: ReaderVoteTarget!, $targetId: ID!) {
  hadesMutations {
    removeVote(targetType: $targetType, targetId: $targetId) {
      message
      annotation {
        id
        positionId
        body
        status
        upvotes
        downvotes
        netScore
        replyCount
        myVote
        updatedAt
      }
      comment {
        id
        annotationId
        body
        status
        upvotes
        downvotes
        netScore
        myVote
        updatedAt
      }
    }
  }
}
