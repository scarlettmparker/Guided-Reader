mutation createAnnotation($input: AnnotationInput!) {
  hadesMutations {
    createAnnotation(input: $input) {
      message
      annotation {
        id
        positionId
        body
        status
        upvotes
        downvotes
        netScore
        replyCount
        position {
          id
          textId
          startOffset
          endOffset
        }
        author {
          type
          id
        }
        authorProfile {
          id
          discordId
          discordUsername
          globalName
          avatar
          cefrLevel
        }
        myVote
        createdAt
        updatedAt
      }
    }
  }
}
