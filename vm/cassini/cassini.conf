# cassini — simulated Raspberry Pi 1 Model B+ running Guided Reader.
#
# Throwaway stand-in, am going to order some Pis soon (hopefully).

# --- identity ---------------------------------------------------------------
NAME=cassini
IMAGE=images:debian/13

# --- storage (hard capped) --------------------------------------------------
POOL=pi
POOL_IMG=/srv/incus-pi.img
POOL_DIR=/srv/incus-pi
STORAGE_SIZE=8G

# --- networking -------------------------------------------------------------
# Managed Incus bridge, but with DHCP/DNS disabled (the host already runs
# pihole on :53 and :67, so Incus must not start its own dnsmasq).
BRIDGE=incusbr0
BRIDGE_CIDR=10.99.0.1/24
CONTAINER_IP=10.99.0.5/24
GATEWAY=10.99.0.1
HOST_PORT=9178
CONTAINER_PORT=5178
APP_PORT=5179
# Name the browser uses. Added to the host's /etc/hosts as 127.0.0.1.
HOST_ALIAS=cassini
# windcatcher's LAN address; the container talks to the backend here.
HOST_IP=192.168.0.106

# --- "hardware": Raspberry Pi 1 Model B+ ------------------------------------
# BCM2835 / ARM1176 @ 700 MHz single core, 512 MB LPDDR2, 10/100 Ethernet,
# microSD storage. LXC shares the host CPU, so the CPU figure is a time-quota
# approximation, not a real clock.
LIMITS_CPU=1
CPU_ALLOWANCE=10ms/100ms
MEMORY=512MiB
SWAP_LIMIT=512M
NET_RATE=100mbit
IO_READ_BPS=20971520
IO_WRITE_BPS=10485760

# --- backend ----------------------------------------------------------------
# Guided Reader talks to the Spring GraphQL backend over GRAPHQL_ENDPOINT.
# https://sun-backend.int.scarlettparker.co.uk/ also works but needs a hosts
# entry + the int CA inside the container.
GRAPHQL_ENDPOINT=http://${HOST_IP}:8083/graphql
CLIENT_ID=guided-reader

# --- tls --------------------------------------------------------------------
# mkcert names the browser uses, and where the pair lands in the container.
TLS_NAMES="cassini localhost 127.0.0.1 ::1"
CONTAINER_TLS_DIR=/opt/cassini/tls

# --- app --------------------------------------------------------------------
APP_DIR=/opt/guided-reader
BUN_BIN=/usr/local/bin/bun
