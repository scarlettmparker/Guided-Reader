# TLS front end for the simulated Pi.

upstream guided_reader {
    server 127.0.0.1:5179;
    keepalive 16;
}

server {
    listen 5178 ssl;
    http2 on;
    server_name cassini localhost 127.0.0.1;

    ssl_certificate     /opt/cassini/tls/cassini.pem;
    ssl_certificate_key /opt/cassini/tls/cassini-key.pem;

    root /opt/guided-reader/dist/client;

    gzip_static on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    location /assets/ {
        alias /opt/guided-reader/dist/client/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location /fonts/ {
        alias /opt/guided-reader/dist/client/fonts/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location / {
        proxy_pass http://guided_reader;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
